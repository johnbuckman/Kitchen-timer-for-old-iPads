<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#000000"/>

  <!-- big clock, hero -->
  <text x="512" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="300" fill="#ffffff" letter-spacing="-8">9:26</text>

  <!-- green count-up button (up arrow) -->
  <rect x="104" y="560" width="384" height="320" rx="56" fill="#338c4c"/>
  <polygon points="296,632 384,772 208,772" fill="#ffffff"/>
  <rect x="264" y="762" width="64" height="58" fill="#ffffff"/>

  <!-- blue count-down button (down arrow) -->
  <rect x="536" y="560" width="384" height="320" rx="56" fill="#3372b2"/>
  <rect x="696" y="620" width="64" height="58" fill="#ffffff"/>
  <polygon points="728,808 816,668 640,668" fill="#ffffff"/>
</svg>
