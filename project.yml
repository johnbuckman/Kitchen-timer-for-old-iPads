# Modern arm64 iPad app project for the NEW iPad (Xcode free-provisioning install).
# Generate with:  xcodegen generate
# Then: open KitchenTimer.xcodeproj, pick your Apple ID team under Signing,
# plug in the new iPad, choose it as the run destination, and press Run.
#
# This is SEPARATE from build-armv7.sh, which still builds the 32-bit iOS 9
# jailbreak version for the OLD iPad mini 1 from the very same source files.
name: KitchenTimer
options:
  bundleIdPrefix: com.johnbuckman
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KitchenTimer:
    type: application
    platform: iOS
    sources:
      - path: KitchenTimer
        excludes:
          - "Info.plist"        # vestigial armv7 plist; we generate App-Info.plist instead
    info:
      path: KitchenTimer/App-Info.plist
      properties:
        CFBundleDisplayName: Kitchen Timer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}        # empty default launch screen -> full-screen on modern iOS
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        # Modern scene lifecycle so the window tracks the real screen size/orientation.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnbuckman.KitchenTimer
        TARGETED_DEVICE_FAMILY: "2"     # iPad
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM intentionally left unset: pick your Apple ID team in Xcode.
        # Mac Catalyst: run the same UIKit app natively on macOS.
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "11.0"
